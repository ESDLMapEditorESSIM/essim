stages:
  - build
  - package

image: maven:3-eclipse-temurin-21

variables:
  REGISTRY: ci.tno.nl

build-essim:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
  script:
    - cd $CI_PROJECT_DIR
    - mvn clean package
  except:
    - main
    - loadflow

build-essim-jar:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
  script:
    - cd $CI_PROJECT_DIR
    - VERSION=$(date +%y.%m)-g$CI_COMMIT_SHORT_SHA
    - echo "VERSION=$VERSION" > build.env
    - mvn -Drevision=$VERSION clean package
  artifacts:
    paths:
      - essim-engine/target/essim.jar
    reports:
      dotenv: build.env
  only:
    - main
    - loadflow

# Switch to Kaniko so the image can be built and pushed without a privileged docker daemon
push-essim:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  needs:
    - build-essim-jar
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR/essim-engine
      --dockerfile $CI_PROJECT_DIR/essim-engine/Dockerfile
      --build-arg VERSION=$VERSION
      --destination ci.tno.nl/essim/open-sourced-essim/essim-engine:$CI_COMMIT_BRANCH
      --destination ci.tno.nl/essim/open-sourced-essim/essim-engine:$CI_COMMIT_SHORT_SHA
  only:
    - main
    - loadflow