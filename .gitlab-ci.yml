stages:
  - build

image: maven:3.9-ibm-semeru-21-jammy

variables:
  REGISTRY: ci.tno.nl

.build-script:
  before_script:
    - apt-get update && apt-get install -y libatomic1 docker.io
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_TNO_REGISTRY


build-essim:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
  extends: .build-script
  script:
    - cd $CI_PROJECT_DIR
    - mvn clean package
  except:
    - main

build-and-push-essim:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
  extends: .build-script
  script:
    - cd $CI_PROJECT_DIR
    - mvn clean package
    - cd $CI_PROJECT_DIR/essim-engine
    - COMMIT_SHA=`git rev-parse --short HEAD`
    - echo $COMMIT_SHA > version.txt
    - docker build --no-cache 
      -t ci.tno.nl/essim/open-sourced-essim/essim-engine:main 
      -t ci.tno.nl/essim/open-sourced-essim/essim-engine:master
      -t ci.tno.nl/essim/open-sourced-essim/essim-engine:$COMMIT_SHA 
      .
    - docker push  --all-tags
      ci.tno.nl/essim/open-sourced-essim/essim-engine
  only: 
    - main

