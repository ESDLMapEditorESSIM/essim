stages:
  - build
  - push

image: maven:3.9.6-eclipse-temurin-11

build-essim:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
  script:
    - cd $CI_PROJECT_DIR
    - apt-get update && apt-get install -y libatomic1
    - mvn clean package -DskipTests


push-essim:
  stage: push
  script:
    - cd $CI_PROJECT_DIR/essim-engine
    - apt-get update && apt-get install -y docker.io
    - COMMIT_SHA=`git rev-parse --short HEAD`
    - echo $COMMIT_SHA > version.txt
    - docker build --no-cache 
      -t ci.tno.nl/essim/open-sourced-essim/essim-engine:master 
      -t ci.tno.nl/essim/open-sourced-essim/essim-engine:$COMMIT_SHA 
      .
    - docker push  --all-tags
      ci.tno.nl/essim/open-sourced-essim/essim-engine
  only: 
    - main

