stages:
  - build

image: maven:3-eclipse-temurin-21

variables:
  REGISTRY: ci.tno.nl

.build-script:
  before_script:
    - apt-get update && apt-get install -y libatomic1 podman
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_TNO_REGISTRY


build-essim:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
  extends: .build-script
  script:
    - cd $CI_PROJECT_DIR
    - mvn clean package
  except:
    - main
    - loadflow

build-and-push-essim:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
  extends: .build-script
  script:
    - cd $CI_PROJECT_DIR
    - COMMIT_SHA=`git rev-parse --short HEAD`
    - VERSION=$(date +%y.%m)-g$COMMIT_SHA
    - mvn -Drevision=$VERSION clean package
    - cd $CI_PROJECT_DIR/essim-engine
    - podman build --no-cache
      --build-arg VERSION=$VERSION
      -t ci.tno.nl/essim/open-sourced-essim/essim-engine:$CI_COMMIT_BRANCH 
      -t ci.tno.nl/essim/open-sourced-essim/essim-engine:$COMMIT_SHA 
      .
    - podman push  --all-tags
      ci.tno.nl/essim/open-sourced-essim/essim-engine
  only: 
    - main
    - loadflow