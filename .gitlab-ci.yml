stages:
  - build

image: maven:3.9.6-eclipse-temurin-11
# Build on:
# - Tags
# - Merge requests
# - Branches
workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

build-essim:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
  script:
    - cd $CI_PROJECT_DIR
    - apt update && apt install -y docker
    - mvn clean package -DskipTest
    - cd essim-engine
    - COMMIT_SHA=`git rev-parse --short HEAD`
    - echo $COMMIT_SHA > version.txt
    - docker build --no-cache 
      -t ci.tno.nl/essim/open-sourced-essim/essim-engine:master 
      -t ci.tno.nl/essim/open-sourced-essim/essim-engine:$COMMIT_SHA 
      .
  when: always

